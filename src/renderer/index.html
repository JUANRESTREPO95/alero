<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Alero</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell" class="collapsed">
    <header id="bar">
      <div class="brand" title="Alero">
        <span class="dot"></span>
        <span class="brand-name">Alero</span>
      </div>

      <nav id="tabs" aria-label="Pestañas"></nav>

      <div class="actions">
        <button id="newTab" class="icon" title="Nueva pestaña (Ctrl+Alt+T)">+</button>
        <button id="settingsBtn" class="icon" title="Ajustes">⚙</button>
        <button id="collapse" class="icon" title="Plegar (Esc)">–</button>
      </div>

      <div id="menu" class="menu hidden"></div>
    </header>

    <main id="terminals"></main>

    <section id="settings" class="settings hidden" aria-label="Ajustes">
      <div class="settings-head">
        <h2>Perfiles de terminal</h2>
        <button id="closeSettings" class="icon" title="Cerrar ajustes">×</button>
      </div>

      <p class="hint">
        Cada perfil es una entrada del menú <strong>+</strong>. <strong>Carpeta</strong>
        es dónde arranca la terminal (vacío = tu carpeta de usuario). El
        <strong>comando</strong> se escribe en la shell elegida al abrir la pestaña
        (déjalo vacío para una shell limpia).
      </p>

      <div id="profileList" class="profile-list"></div>

      <div class="settings-actions">
        <button id="addProfile">+ Añadir perfil</button>
        <button id="restoreProfiles">Restaurar por defecto</button>
        <span class="spacer"></span>
        <button id="saveProfiles" class="primary">Guardar</button>
      </div>
    </section>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
